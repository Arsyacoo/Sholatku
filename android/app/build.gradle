apply plugin: 'com.android.application'

def localSigningProperties = new Properties()
def localSigningHome = System.getenv('USERPROFILE') ?: System.getProperty('user.home')
def localSigningPropertiesFile = new File(localSigningHome, '.gradle/gradle.properties')
if (localSigningPropertiesFile.isFile()) {
    localSigningPropertiesFile.withInputStream { localSigningProperties.load(it) }
}

def signingProperty = { String name ->
    System.getenv(name) ?: project.findProperty(name)?.toString() ?: localSigningProperties.getProperty(name)
}

def uploadStoreFile = signingProperty('SHOLATKU_UPLOAD_STORE_FILE')
def uploadStorePassword = signingProperty('SHOLATKU_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = signingProperty('SHOLATKU_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = signingProperty('SHOLATKU_UPLOAD_KEY_PASSWORD')
def releaseSigningConfigured = [
    uploadStoreFile,
    uploadStorePassword,
    uploadKeyAlias,
    uploadKeyPassword
].every { it }

def directStoreFile = signingProperty('SHOLATKU_DIRECT_STORE_FILE')
def directStorePassword = signingProperty('SHOLATKU_DIRECT_STORE_PASSWORD')
def directKeyAlias = signingProperty('SHOLATKU_DIRECT_KEY_ALIAS')
def directKeyPassword = signingProperty('SHOLATKU_DIRECT_KEY_PASSWORD')
def directSigningConfigured = [
    directStoreFile,
    directStorePassword,
    directKeyAlias,
    directKeyPassword
].every { it }

if (!releaseSigningConfigured) {
    logger.lifecycle('Release signing is not configured. Set SHOLATKU_UPLOAD_STORE_FILE, SHOLATKU_UPLOAD_STORE_PASSWORD, SHOLATKU_UPLOAD_KEY_ALIAS, and SHOLATKU_UPLOAD_KEY_PASSWORD using environment variables or user-local Gradle properties.')
}

if (!directSigningConfigured) {
    logger.lifecycle('Direct signing is not configured. Set SHOLATKU_DIRECT_STORE_FILE, SHOLATKU_DIRECT_STORE_PASSWORD, SHOLATKU_DIRECT_KEY_ALIAS, and SHOLATKU_DIRECT_KEY_PASSWORD using environment variables or user-local Gradle properties.')
}

android {
    namespace = "io.github.arsyacoo.sholatku"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.arsyacoo.sholatku"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
        if (directSigningConfigured) {
            direct {
                storeFile file(directStoreFile)
                storePassword directStorePassword
                keyAlias directKeyAlias
                keyPassword directKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        direct {
            minifyEnabled false
            debuggable false
            matchingFallbacks = ['release']
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (directSigningConfigured) {
                signingConfig signingConfigs.direct
            }
        }
    }
}

tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
    doFirst {
        if (!releaseSigningConfigured) {
            throw new GradleException('Release signing configuration is missing. Set SHOLATKU_UPLOAD_STORE_FILE, SHOLATKU_UPLOAD_STORE_PASSWORD, SHOLATKU_UPLOAD_KEY_ALIAS, and SHOLATKU_UPLOAD_KEY_PASSWORD using environment variables or user-local Gradle properties.')
        }
    }
}

tasks.matching { it.name == 'assembleDirect' }.configureEach {
    doFirst {
        if (!directSigningConfigured) {
            throw new GradleException('Direct signing configuration is missing. Set SHOLATKU_DIRECT_STORE_FILE, SHOLATKU_DIRECT_STORE_PASSWORD, SHOLATKU_DIRECT_KEY_ALIAS, and SHOLATKU_DIRECT_KEY_PASSWORD using environment variables or user-local Gradle properties.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
